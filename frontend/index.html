<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/keystone.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Keystone shows which skills depend on too few people and tests whether development closes the gap." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f5f7" />
    <title>Keystone</title>
    <script>
      // Apply the saved theme and language before the first paint, so a dark page never flashes light.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('keystone.preferences') || '{}');
          if (saved.theme === 'light' || saved.theme === 'dark') document.documentElement.setAttribute('data-theme', saved.theme);
          if (typeof saved.language === 'string') document.documentElement.setAttribute('lang', saved.language);
        } catch (error) {
          // Storage blocked: the page follows the system theme.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
